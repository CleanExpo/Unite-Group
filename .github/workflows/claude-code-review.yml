name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Direct review: the prompt is inline and the action drives the review
      # itself. This deliberately does NOT use `plugin_marketplaces` + `plugins`
      # with a `/code-review:code-review` slash command. That arrangement
      # installed the marketplace and plugin successfully but then failed on
      # every run against PRs #1041 and #1042 — the slash command did not
      # resolve, so the run aborted on turn 1:
      #
      #   {"subtype":"success","is_error":true,"duration_ms":1982,
      #    "num_turns":1,"total_cost_usd":0}
      #   ##[error]Claude execution failed: result is_error:true
      #
      # Zero cost and one turn means no review work was ever attempted. The
      # failure was silent in effect: #1042 (42 files, the whole approval,
      # publishing and paid-generation surface) merged with no Claude review at
      # all. The shape below follows the action's own current example,
      # examples/pr-review-comprehensive.yml.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@24dcd50c0568f0fc9e9211213a4fd2d9eb15c4e0 # v1
        with:
          # OAuth, not anthropic_api_key — ANTHROPIC_API_KEY is empty in this
          # repo's runners and an empty value breaks the CLI.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # track_progress is deliberately NOT set. At this pinned SHA it
          # overrides the explicit-prompt agent path and forces tag mode, which
          # runs with acceptEdits and carries git add/commit plus the action's
          # push wrapper, checking out an open PR's branch and generating an
          # instruction to push to it. This job reads attacker-controllable diff
          # text, so that combination lets a hostile diff steer a reviewer into
          # writing to the branch it is reviewing. A progress indicator is not
          # worth turning a release-gate reviewer into a writer.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read the diff with `gh pr diff`. The
            checkout is shallow (depth 1), so use the gh CLI rather than
            assuming local history is present.

            Report only defects you can demonstrate from the code you read.
            For each finding give file:line, a concrete failure or exploit
            scenario with specific inputs and the resulting wrong outcome, and
            a severity. Say explicitly what you verified by reading code versus
            what you inferred. Do not report style preferences, and do not pad
            the review — "no defects found in X" is a useful result.

            Weight these first. They are where this repository has actually
            been hurt before:

            1. Cross-business data leaks. This estate serves separate
               businesses (CCW, CARSI, RestoreAssist) whose brand, customer,
               channel and analytics data must never mix. Look for queries,
               caches, SWR keys or handlers missing a business/organisation
               scope, or scoped by user id alone where a business key is
               required.
            2. Approval bypasses. A human must approve the exact version before
               any paid media generation, and the exact post before any
               external publishing. Trace every path that can spend or publish,
               including cron and webhook paths, and check each one reads an
               approval.
            3. Stale approval reuse. Changing the words, image, call to action,
               hashtags or brand must invalidate an approval. Check what the
               approval is bound to. Treat a fingerprint over a mutable pointer
               (a storage URL, an implicit join) as suspect: ask whether the
               thing it points at can change while the fingerprint does not.
            4. Unauthorised publishing, including anything that can post
               externally without a per-post approval.
            5. Duplicate paid work. Idempotency keys for paid providers must be
               stable across retries and safe under concurrency.
            6. Webhook security: signature verification, timing-safe compare,
               replay protection, and whether a missing secret fails open.
            7. Schema and runtime defects: null dereferences, unhandled
               rejections, wrong column names, races.

            Anything that fails open, or that guards one route into a paid or
            publishing action while leaving a second route into the same action
            unguarded, is a finding regardless of which files this PR touched.

            Report every finding as an inline comment on the line it concerns.
            Put the overall verdict in an inline comment on the most relevant
            line of the most significant finding, or — when you find nothing —
            on any line of the diff.

          # Allow Dependabot and other bots to trigger this review. Without this,
          # Dependabot PRs fail with "Workflow initiated by non-human actor".
          allowed_bots: dependabot

          # Read-only tools plus one PR-bound write.
          #
          # `Bash(gh pr comment:*)` was considered and rejected: the glob
          # authorises every argument the subcommand takes, including a
          # different PR number, --repo, --edit-last and --delete-last --yes. It
          # is not scoped to the PR under review, and this job feeds
          # attacker-controllable diff text to a model holding a repo-scoped
          # write token, so injection could comment on or delete comments from
          # unrelated PRs. The inline-comment MCP tool is bound to the PR under
          # review and is the only write primitive granted here. `gh pr
          # diff`/`view` stay: both are read-only.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
