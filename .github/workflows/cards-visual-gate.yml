name: Cards order visual gate

# UNI-3038: the /cards/order See-Pick-Tweak pixel gate (UNI-2996) went stale because it only ran on laptops.
# This runs it on every pull request that can change the page. The job always starts and decides inside
# whether the change is in scope, so it can be made a required check without blocking unrelated PRs.
# Snapshots are compared inside the pinned Playwright container below; regenerate them in that same image.
# On a failure the actual and diff images are uploaded so a reviewer can look at them before committing new ones.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cards-visual-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  visual-gate:
    name: Cards order visual gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether this change can alter the order page
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed diff fails the job: an unknown change set is never treated as out of scope.
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          pattern='^(apps/web/src/app/cards/|apps/web/src/components/public/|apps/web/e2e/visual/|apps/web/playwright\.visual\.config\.ts|apps/web/package\.json|apps/web/pnpm-lock\.yaml|apps/web/src/app/globals\.css|apps/web/src/app/layout\.tsx|\.github/workflows/cards-visual-gate\.yml)'
          if printf '%s\n' "$changed" | grep -Eq "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No file that can change /cards/order was touched; the gate has nothing to compare."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '24.14.1'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Run the visual gate (builds the app itself, never VISUAL_SKIP_BUILD)
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/web
        env:
          HOME: /root
        run: pnpm run visual:gate

      - name: Upload actual and diff images
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cards-visual-gate-results
          path: |
            apps/web/test-results/visual
            apps/web/e2e/visual/__screenshots__
          retention-days: 14
