name: Canonical naming guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  naming-drift:
    name: Prevent retired identity drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check new lines for retired product naming
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          scripts/check-canonical-naming.sh "origin/${{ github.base_ref }}" HEAD
