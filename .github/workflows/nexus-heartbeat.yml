name: Nexus Heartbeat

# The scheduled pulse (UNI-2523): proves the gates daily and reports the distance
# to the North Star while nobody is watching.
#
# AUTHORITY. This workflow OBSERVES AND REPORTS — Waterline Class 0/1. It must not
# deploy, merge, or arm anything: merge is not deploy (UNI-2542) and there is one
# release authority (UNI-2562).
#
# THE WRITE TOKEN'S BLAST RADIUS IS REDUCED, NOT ELIMINATED. Permissions are
# granted per job, so `observe` — the job that runs `npm ci` and three
# repository-controlled npm scripts — holds `contents: read` and nothing else.
# Only `report` holds `issues: write`, and it installs nothing and sparse-checks-out
# a single file. Both checkouts set `persist-credentials: false`.
#
# State the limit exactly, because round two was right to push on it: `report`
# still EXECUTES one repository-controlled file (scripts/nexus-heartbeat.mjs)
# while holding that token, and sparse checkout restricts files, not API reach.
# Anyone able to land arbitrary code in that file can call the issues API with it.
# What the split buys is that `npm ci` and the gate scripts — the large,
# dependency-laden surface — no longer run under the token at all. That is a real
# reduction and it is not the same as containment.
#
# HONEST DEGRADATION, AND ITS CEILING. Every gate runs with its exit code
# captured, so one red gate cannot hide the others, and `report` runs with
# `if: always()` so a dead observe job publishes NOT RUN rows under a DEGRADED
# banner instead of leaving yesterday's PASS standing. The ceiling: if the report
# job itself cannot run — checkout fails, the import throws, the API rejects the
# write — NOTHING updates the issue, and the previous body stays live. No workflow
# can report its own total failure from inside itself. That is why every body is
# stamped with its run id and generation time and says so: a reader checks the
# timestamp, and an external watchdog is the only real answer.
#
# All decision logic lives in scripts/nexus-heartbeat.mjs where tests can reach
# it. The capture step records EXIT CODES ONLY — it does not decide PASS or FAIL.

on:
  schedule:
    # 19:00 UTC = 05:00 Brisbane (AEST, UTC+10, no DST).
    - cron: '0 19 * * *'
  # Manual dispatch exists so the issue can be seen once before the cron is trusted.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-heartbeat
  cancel-in-progress: false

jobs:
  observe:
    name: Run the gates and capture every result
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # engines require >=24.14.1 <25. The root is NOT a pnpm workspace
          # (apps/web is one itself; pnpm cannot nest), so the root uses npm.
          node-version: '24.14.1'

      - name: Install root dependencies
        run: npm ci

      # The shell records EXIT CODES ONLY. It used to decide `status=PASS` itself,
      # which put a verdict back inside the YAML where no test could reach it —
      # the same shape as the round-one P0, one layer down. reconcileGates derives
      # PASS/FAIL from the exit code now, and a test asserts the YAML never
      # mentions PASS again.
      - name: Run gates and capture every exit code
        run: |
          set +e
          mkdir -p /tmp/heartbeat
          results='[]'
          for gate in verify:readiness verify:docs-watch verify:docs-review; do
            npm run "$gate" > "/tmp/heartbeat/${gate//:/-}.log" 2>&1
            code=$?
            results=$(node -e '
              const [existing, name, code] = process.argv.slice(1);
              const list = JSON.parse(existing);
              list.push({ name, exitCode: Number(code) });
              console.log(JSON.stringify(list));
            ' "$results" "$gate" "$code")
          done
          printf '%s' "$results" > /tmp/heartbeat/gate-results.json
          cat /tmp/heartbeat/gate-results.json

      # Exit 1 means rows did not parse; the JSON is still written and the report
      # renders the integrity failure, so the step must not abort the upload.
      - name: Compute founder-queue age
        run: node scripts/founder-queue.mjs > /tmp/heartbeat/queue.json || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heartbeat-evidence
          path: /tmp/heartbeat
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Create or update the pinned heartbeat issue
    needs: [observe]
    # ALWAYS. A skipped report is the failure mode this workflow exists to prevent:
    # it leaves the previous run's PASS body live as the newest thing anyone reads.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Exactly one file, no history, no credentials, no install. Nothing in this
      # job executes repository code other than scripts/nexus-heartbeat.mjs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/nexus-heartbeat.mjs
          sparse-checkout-cone-mode: false

      - name: Download the evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: heartbeat-evidence
          path: /tmp/heartbeat

      - name: Create or update the pinned heartbeat issue
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const {
              DECLARED_GATES,
              composeHeartbeat, findOwnedIssue, readEvidence, upsertHeartbeatIssue,
            } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/nexus-heartbeat.mjs`);

            const client = {
              // paginate, not per_page: a heartbeat sitting past the first page
              // reads as absent and opens a duplicate every single run.
              listOpenIssues: async () => {
                const data = await github.paginate(github.rest.issues.listForRepo, {
                  owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
                });
                // pull_request is carried through: this endpoint returns PRs too,
                // and findOwnedIssue must be able to tell them apart.
                return data.map((issue) => ({
                  number: issue.number,
                  title: issue.title,
                  body: issue.body,
                  pull_request: issue.pull_request,
                }));
              },
              createIssue: async ({ title, body }) => {
                const { data } = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo, title, body,
                });
                return { number: data.number };
              },
              updateIssue: async (issue_number, { title, body }) => {
                const { data } = await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number, title, body,
                });
                return { number: data.number };
              },
            };

            // Same selector the upsert uses. Picking the previous body with a
            // different rule read one issue's gates while rewriting another's.
            const previous = findOwnedIssue(await client.listOpenIssues());

            const { body, degraded, anomalies } = composeHeartbeat({
              date: new Date().toISOString().slice(0, 10),
              gateEvidence: readEvidence('/tmp/heartbeat/gate-results.json'),
              queueEvidence: readEvidence('/tmp/heartbeat/queue.json'),
              previousBody: previous?.body ?? null,
              provenance: {
                runId: context.runId,
                runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                generatedAt: new Date().toISOString(),
              },
              declared: DECLARED_GATES,
            });

            const result = await upsertHeartbeatIssue({ client, body });
            core.info(`Heartbeat issue ${result.action}: #${result.number}`);

            // A degraded report is published, THEN the run is failed. Publishing
            // first is what keeps the issue honest; failing after is what makes
            // the incompleteness visible in the Actions list.
            if (degraded) {
              core.setFailed(`Heartbeat is degraded:\n${anomalies.map((a) => `- ${a}`).join('\n')}`);
            }
